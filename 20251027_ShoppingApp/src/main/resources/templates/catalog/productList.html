<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>商品一覧</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <style>
            body { font-family: Arial, sans-serif; background-color: #f9f9f9; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
            h1 { font-size: 2em; color: #333; margin: 20px 0; }
            table { width: 80%; border-collapse: collapse; margin: 20px 0; background-color: #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
            th, td { padding: 12px 15px; text-align: left; }
            th { background-color: #f0f0f0; color: #333; font-weight: bold; border-bottom: 2px solid #ddd; }
            tr:nth-child(even) { background-color: #f7f7f7; }
            tr:hover { background-color: #f0f8ff; }
            a { text-decoration: none; color: #3498db; }
            a:hover { text-decoration: underline; }

            .top-right-container { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: row; align-items: center; gap: 10px; }
            .icon-button { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; background-color: #ffffff; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 3px 6px rgba(0,0,0,0.06); cursor: pointer; transition: background-color 0.12s ease, transform 0.06s ease; text-decoration: none; color: inherit; padding: 0; }
            .icon-button:hover { background-color: #f2f8ff; transform: translateY(-2px); }
            .icon-button svg { width: 22px; height: 22px; display: block; }
            .user-icon { background-color: #3498db; color: #fff; border: none; }
            .user-icon:hover { background-color: #2b86c7; }
            .logout-icon { background-color: #e74c3c; color: #fff; border: none; }
            .logout-icon:hover { background-color: #c0392b; }
            .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

            /* ページネーション（枠なし） */
            .pager { width: 80%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
            .meta { color: #666; font-size: 0.95em; }

            .page-links { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 0.95em; }
            /* 枠や背景を無くす */
            .page-links a, .page-links span, .page-links strong {
                padding: 4px 6px;
                background: transparent;
                border: none;
                color: #3498db;
                text-decoration: none;
                font-weight: 400;
            }
            /* ホバー時の視覚フィードバックは下線と薄い背景だけに */
            .page-links a:hover {
                text-decoration: underline;
                background: rgba(52,152,219,0.04);
                border-radius: 4px;
            }
            /* 現在ページは枠なしで太字・色を変更 */
            .page-links strong {
                color: #222;
                font-weight: 700;
            }
            /* 無効（前へ/次へが押せないとき） */
            .page-links .disabled {
                color: #999;
                opacity: 0.6;
                cursor: default;
                text-decoration: none;
            }

            .dots { color: #999; padding: 4px 6px; }

            /* ページジャンプ（小さなフォーム） */
            .page-jump { display: flex; gap: 8px; align-items: center; }
            .page-jump input[type="number"] { width: 72px; padding: 6px 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 0.95em; }
            .page-jump button { padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.06); background: #fff; color: #3498db; cursor: pointer; }
            .page-jump button:hover { background: rgba(52,152,219,0.04); }

            @media (max-width: 700px) { table, .pager { width: 95%; } .top-right-container { gap: 8px; right: 12px; top: 12px; } .page-jump input[type="number"] { width: 56px; } }
        </style>
    </head>
    <body>
        <div class="top-right-container">
            <a th:href="@{/user/profile}" class="icon-button user-icon" aria-label="ユーザー情報" title="ユーザー情報">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 12c2.7614 0 5-2.2386 5-5s-2.2386-5-5-5-5 2.2386-5 5 2.2386 5 5 5z" fill="currentColor"/>
                    <path d="M4 20c0-3.3137 2.6863-6 6-6h4c3.3137 0 6 2.6863 6 6v1H4v-1z" fill="currentColor"/>
                </svg>
                <span class="sr-only">ユーザー情報</span>
            </a>
            <form action="/logout" method="POST">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="icon-button logout-icon" aria-label="ログアウト" title="ログアウト">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h2V2z" fill="currentColor"/>
                        <path d="M9 22h8V2H9v20z" fill="rgba(255,255,255,0.06)"/>
                        <path d="M15 12h-5v-2h5V7l4 4-4 4v-3z" fill="currentColor"/>
                    </svg>
                    <span class="sr-only">ログアウト</span>
                </button>
            </form>
        </div>

        <h1>商品一覧</h1>

        <table>
          <tr>
            <th>商品名</th>
            <th>価格</th>
            <th>在庫数</th>
          </tr>
          <tr th:each="prod : ${productList}">
            <td><a th:href="@{/catalog/display-details(productId=${prod.id})}"><span th:text="${prod.name}"></span></a></td>
            <td><span th:text="${prod.price}"></span>円</td>
            <td><span th:text="${prod.stock}"></span></td>
          </tr>
          <tr th:if="${#lists.isEmpty(productList)}">
            <td colspan="3" style="text-align:center; padding:20px;">表示する商品がありません。</td>
          </tr>
        </table>

        <div class="pager" role="region" aria-label="ページネーション">
            <div class="meta">
                表示：
                <span th:text="${(currentPage - 1) * pageSize + 1}">1</span>
                -
                <span th:text="${currentPage * pageSize > totalCount ? totalCount : currentPage * pageSize}">5</span>
                / <span th:text="${totalCount}">0</span> 件
            </div>

            <!-- ページリンク（省略ありの表示） -->
            <div class="page-links" role="navigation" aria-label="ページ番号"
                 th:with="start=${currentPage - 2 > 1 ? currentPage - 2 : 1}, end=${currentPage + 2 < totalPages ? currentPage + 2 : totalPages}">
                <!-- 前へ -->
                <a th:if="${currentPage > 1}" th:href="@{/catalog/display-list(page=${currentPage-1})}" aria-label="前のページ">前へ</a>
                <span th:if="${currentPage == 1}" class="disabled">前へ</span>

                <!-- 最初のページ（必要なら表示） -->
                <a th:if="${start > 1}" th:href="@{/catalog/display-list(page=1)}">1</a>
                <span th:if="${start > 2}" class="dots" aria-hidden="true">…</span>

                <!-- 現在ページの前後2ページ分（可変） -->
                <span th:each="i : ${#numbers.sequence(start, end)}">
                    <a th:if="${i != currentPage}" th:href="@{/catalog/display-list(page=${i})}" th:text="${i}">1</a>
                    <strong th:if="${i == currentPage}" th:text="${i}">1</strong>
                </span>

                <!-- 最後のページ（必要なら表示） -->
                <span th:if="${end < totalPages - 1}" class="dots" aria-hidden="true">…</span>
                <a th:if="${end < totalPages}" th:href="@{/catalog/display-list(page=${totalPages})}" th:text="${totalPages}"></a>

                <!-- 次へ -->
                <a th:if="${currentPage < totalPages}" th:href="@{/catalog/display-list(page=${currentPage+1})}" aria-label="次のページ">次へ</a>
                <span th:if="${currentPage >= totalPages}" class="disabled">次へ</span>
            </div>

            <!-- ページジャンプ（ページ番号へ直接移動） -->
            <form th:action="@{/catalog/display-list}" method="get" class="page-jump" aria-label="ページジャンプ">
                <label for="pageInput" class="sr-only">ページ番号</label>
                <input id="pageInput" type="number" name="page" min="1" th:attr="max=${totalPages}" placeholder="ページ" required />
                <input type="hidden" name="size" th:value="${pageSize}" />
                <button type="submit">移動</button>
            </form>
        </div>

        <script>
            (function(){
                // ページジャンプ入力の範囲チェック（クライアント側の便宜用）
                var input = document.getElementById('pageInput');
                if (!input) return;
                var max = parseInt(input.getAttribute('max') || '1', 10);
                input.addEventListener('input', function () {
                    var v = parseInt(this.value, 10);
                    if (isNaN(v)) return;
                    if (v < 1) this.value = 1;
                    if (v > max) this.value = max;
                });
                // フォーム送信時にも最終チェック
                input.form && input.form.addEventListener('submit', function (e) {
                    var v = parseInt(input.value, 10);
                    if (isNaN(v) || v < 1) {
                        input.value = 1;
                    } else if (v > max) {
                        input.value = max;
                    }
                });
            })();
        </script>
    </body>
</html>
