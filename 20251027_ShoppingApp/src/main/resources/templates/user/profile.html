<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <title>ユーザープロファイル</title>
        <style>
            /* 共通レイアウト（商品一覧と同一） */
            body {
                font-family: Arial, sans-serif;
                background-color: #f9f9f9;
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
            }
            h1 { font-size: 2em; color: #333; margin: 20px 0; }

            /* コンテナ（中央のカード） */
            .content-wrapper {
                width: 80%;
                max-width: 900px;
                margin-bottom: 40px;
            }

            .card {
                background-color: #fff;
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
                border-radius: 8px;
                overflow: hidden;
            }
            .card-body {
                padding: 20px;
            }

            /* 定義リストのスタイル（プロファイル表示用） */
            dl.profile {
                margin: 0;
            }
            dl.profile dt {
                color: #666;
                font-weight: bold;
                width: 30%;
                float: left;
                box-sizing: border-box;
                padding: 8px 0;
                clear: left;
            }
            dl.profile dd {
                margin: 0 0 8px 30%;
                padding: 8px 0;
                color: #333;
            }

            /* 戻るリンク */
            .back-link {
                display: inline-block;
                margin-top: 16px;
                color: #3498db;
                text-decoration: none;
            }
            .back-link:hover { text-decoration: underline; }

            /* 右上アイコン群（横並び） */
            .top-right-container {
                position: absolute;
                top: 20px;
                right: 20px;
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 10px;
            }

            /* 共通のボタンサイズを揃える */
            .icon-button {
                width: 44px;
                height: 44px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border-radius: 8px;
                background-color: #ffffff;
                border: 1px solid rgba(0,0,0,0.06);
                box-shadow: 0 3px 6px rgba(0,0,0,0.06);
                cursor: pointer;
                transition: background-color 0.12s ease, transform 0.06s ease;
                text-decoration: none;
                color: inherit;
                padding: 0;
            }
            .icon-button:hover { background-color: #f2f8ff; transform: translateY(-2px); }

            .icon-button svg {
                width: 22px;
                height: 22px;
                display: block;
            }

            .user-icon {
                background-color: #3498db;
                color: #fff;
                border: none;
            }
            .user-icon:hover { background-color: #2b86c7; }

            .logout-icon {
                background-color: #e74c3c;
                color: #fff;
                border: none;
            }
            .logout-icon:hover { background-color: #c0392b; }

            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0,0,0,0);
                white-space: nowrap;
                border: 0;
            }

            @media (max-width: 768px) {
                .content-wrapper { width: 94%; }
                dl.profile dt, dl.profile dd { float: none; width: auto; margin-left: 0; }
                dl.profile dt { padding-top: 12px; }
            }

            @media (max-width: 480px) {
                .top-right-container {
                    gap: 8px;
                    right: 12px;
                    top: 12px;
                }
            }
        </style>
    </head>
    <body>

        <h1>プロフィール</h1>

        <div class="content-wrapper">
            <div class="card">
                <div class="card-body">
                    <dl class="profile" role="list">
                        <dt>氏名</dt>
                        <dd th:text="${profile.username}">username</dd>

                        <dt>権限</dt>
                        <dd th:text="${profile.role}">ROLE_USER</dd>

                        <dt>合計商品点数</dt>
                        <dd th:text="${profile.itemsPurchased}">0</dd>

                        <dt>注文回数</dt>
                        <dd th:text="${profile.purchaseCount}">0</dd>

                        <dt>合計金額</dt>
                        <dd th:text="${profile.totalSpentFormatted}">¥0</dd>

                        <dt>保有ポイント</dt>
                        <dd th:text="${profile.points}">0</dd>

                        <dt>ポイント還元率</dt>
                        <dd th:text="${profile.pointRateFormatted}">0%</dd>
                    </dl>

                    <a th:href="@{/catalog/display-list}" class="back-link">商品一覧に戻る</a>
                </div>
            </div>
        </div>
    </body>
</html>
