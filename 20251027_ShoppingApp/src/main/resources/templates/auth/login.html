<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ログイン</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg1:#f5f7fb;
            --bg2:#e9eef8;
            --card:#ffffff;
            --primary:#2563eb; /* blue-600 */
            --accent:#0ea5a4;  /* teal-500 */
            --muted:#6b7280;
            --error:#dc2626;
            --success:#16a34a;
            --radius:12px;
            --shadow: 0 6px 24px rgba(18, 24, 40, 0.08);
            font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }

        html,body{height:100%}
        body{
            margin:0;
            display:flex;
            align-items:center;
            justify-content:center;
            background: linear-gradient(180deg,var(--bg1),var(--bg2));
            padding:32px;
            color:#0f172a;
        }

        .card{
            width:100%;
            max-width:420px;
            background:var(--card);
            border-radius:var(--radius);
            box-shadow:var(--shadow);
            padding:28px;
            box-sizing:border-box;
        }

        .brand{
            display:flex;
            align-items:center;
            gap:12px;
            margin-bottom:8px;
        }
        .logo{
            width:44px;
            height:44px;
            border-radius:10px;
            background:linear-gradient(135deg,var(--primary),var(--accent));
            display:inline-flex;
            align-items:center;
            justify-content:center;
            color:#fff;
            font-weight:600;
            font-size:18px;
        }
        h1{
            margin:0 0 8px 0;
            font-size:20px;
            letter-spacing:-0.2px;
        }
        p.lead{
            margin:0 0 18px 0;
            color:var(--muted);
            font-size:13px;
        }

        form > .field{
            margin-bottom:14px;
        }
        label{
            display:block;
            font-size:13px;
            margin-bottom:6px;
            color:#111827;
        }
        input[type="text"],
        input[type="password"]{
            width:100%;
            padding:12px 12px;
            border-radius:10px;
            border:1px solid #e6e9f0;
            background:#fff;
            font-size:14px;
            box-sizing:border-box;
            transition:box-shadow .12s, border-color .12s;
        }
        input:focus{
            outline:none;
            border-color:rgba(37,99,235,0.9);
            box-shadow:0 6px 18px rgba(37,99,235,0.08);
        }
        .row{
            display:flex;
            gap:12px;
            align-items:center;
        }
        .remember{
            font-size:13px;
            color:var(--muted);
            display:flex;
            align-items:center;
            gap:8px;
        }
        .actions{
            margin-top:8px;
            display:flex;
            gap:12px;
            align-items:center;
            justify-content:space-between;
        }
        button[type="submit"]{
            background:linear-gradient(90deg,var(--primary),#1e40af);
            color:#fff;
            border:none;
            padding:10px 16px;
            border-radius:10px;
            font-weight:600;
            cursor:pointer;
            box-shadow:0 6px 16px rgba(37,99,235,0.18);
        }
        button[type="button"].linklike{
            background:transparent;
            border:0;
            color:var(--primary);
            font-weight:600;
            cursor:pointer;
            padding:8px;
        }
        a.textlink{
            color:var(--primary);
            text-decoration:underline;
            font-size:13px;
        }

        .muted{
            color:var(--muted);
            font-size:13px;
        }

        .message{
            margin-top:10px;
            padding:10px 12px;
            border-radius:8px;
            font-size:13px;
        }
        .error{
            background:#fff5f5;
            border:1px solid rgba(220,38,38,0.12);
            color:var(--error);
        }
        .success{
            background:#f0fdf4;
            border:1px solid rgba(16,185,129,0.08);
            color:var(--success);
        }

        /* 新しいパスワード行（新規登録ページに合わせたスタイル） */
        .pw-row{
            display:flex;
            gap:8px;
            align-items:center;
        }
        .pw-row input[type="password"],
        .pw-row input[type="text"]{
            flex:1;
            margin:0; /* 既存の入力スタイルと合わせる */
        }
        .toggle-pw{
            background:none;
            border:none;
            color:var(--primary);
            cursor:pointer;
            padding:6px;
            font-size:0.95rem;
        }

        footer{
            margin-top:14px;
            text-align:center;
            font-size:13px;
            color:var(--muted);
        }

        @media (max-width:420px){
            .card{padding:20px}
        }
    </style>
</head>
<body>
    <main class="card" role="main">
        <div class="brand" aria-hidden="true">
            <div class="logo">NX</div>
            <div>
                <h1>ログイン</h1>
                <p class="lead">安全にサインインしてください</p>
            </div>
        </div>

        <form th:action="@{/login}" method="post" novalidate>
            <!-- Spring CSRF token -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="field">
                <label for="username">ユーザー名</label>
                <input id="username" name="username" type="text" th:value="${param.username}" placeholder="ユーザー名を入力" required autofocus>
            </div>

            <div class="field">
                <label for="password">パスワード</label>
                <div class="pw-row">
                    <input id="password" name="password" type="password" placeholder="パスワードを入力" required aria-required="true" autocomplete="current-password" />
                    <button type="button" class="toggle-pw" aria-label="パスワードの表示切替" aria-pressed="false" onclick="togglePassword(this)">表示</button>
                </div>
            </div>

            <div class="actions">
                <button type="submit">ログイン</button>
                <a th:href="@{/register}" class="muted">新規登録</a>
            </div>

            <div style="margin-top:10px;">
                <div th:if="${param.error}" role="alert" aria-live="assertive" class="message error">
                    ログインに失敗しました。ユーザー名またはパスワードが間違っています。
                </div>
                <div th:if="${param.logout}" role="status" aria-live="polite" class="message success">
                    ログアウトしました。
                </div>
            </div>
        </form>

    </main>

    <script>
        // パスワード表示切替（新規登録ページの実装と同様の振る舞い）
        function togglePassword(btn){
            var pw = document.getElementById('password');
            if(!pw || !btn) return;
            var pressed = btn.getAttribute('aria-pressed') === 'true';
            if(pressed){
                pw.type = 'password';
                btn.textContent = '表示';
                btn.setAttribute('aria-pressed','false');
            } else {
                pw.type = 'text';
                btn.textContent = '非表示';
                btn.setAttribute('aria-pressed','true');
            }
            // 操作後もフォーカスを保持（キーボード操作対応）
            btn.focus();
        }
    </script>
</body>
</html>
