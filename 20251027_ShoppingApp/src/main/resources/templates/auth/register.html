<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>新規登録</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--primary:#007bff;--muted:#666;--danger:#b00020;--success:#117a3d}
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial; background:var(--bg); color:#222; margin:0; padding:20px}
    .container{max-width:520px;margin:36px auto;background:var(--card);padding:24px;border-radius:10px;box-shadow:0 6px 18px rgba(30,40,50,0.06)}
    h1{margin:0 0 16px;font-size:1.25rem}
    .form-row{display:flex;flex-direction:column;margin-bottom:12px}
    label{font-weight:600;margin-bottom:6px}
    input[type="text"], input[type="password"], select{padding:10px 12px;border:1px solid #d6dbe5;border-radius:8px;font-size:1rem}
    .actions{display:flex;gap:8px;justify-content:flex-start;margin-top:8px;flex-wrap:wrap}
    button.primary{background:var(--primary);color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer}
    button.secondary, a.button-secondary{background:#6c757d;color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    button[disabled]{opacity:0.6;cursor:not-allowed}
    .msg{padding:10px;border-radius:8px;margin-bottom:12px;font-size:0.95rem}
    .msg.error{background:#fff5f5;color:var(--danger);border:1px solid #f5c2c2}
    .msg.success{background:#f0fff4;color:var(--success);border:1px solid #b7f0c6}
    .field-error{color:var(--danger);font-size:0.9rem;margin-top:6px}
    .small{font-size:0.85rem;color:var(--muted)}
    .pw-row{display:flex;gap:8px;align-items:center}
    .toggle-pw{background:none;border:none;color:var(--primary);cursor:pointer;padding:6px;font-size:0.95rem}
    .back-link{margin-top:12px;font-size:0.95rem}
    .center-row{display:flex;gap:8px;align-items:center}
  </style>
</head>
<body>
  <div class="container">
    <h1>新規登録</h1>

    <!-- サーバ側メッセージ -->
    <div th:if="${errorMessage}" class="msg error" role="alert" aria-live="assertive" th:text="${errorMessage}"></div>

    <!-- 登録成功時はログインへの導線を表示 -->
    <div th:if="${success}" class="msg success" role="status" aria-live="polite">
      登録が完了しました。
      <div style="margin-top:8px">
        <a th:href="@{/login}" class="button-secondary" role="button">ログインへ</a>
      </div>
    </div>

    <!-- 登録フォーム -->
    <form th:action="@{/register}" th:object="${user}" method="post" id="registerForm" onsubmit="disableOnSubmit(event)" novalidate>
      <!-- CSRF -->
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="form-row">
        <label for="username">ユーザー名</label>
        <input type="text" id="username" name="username" th:field="*{username}" required aria-required="true" maxlength="50" autocomplete="username" />
        <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
      </div>

      <div class="form-row">
        <label for="password">パスワード <span class="small">(8文字以上推奨)</span></label>
        <div class="pw-row">
          <input type="password" id="password" name="password" th:field="*{password}" required aria-required="true" minlength="8" autocomplete="new-password" style="flex:1" />
          <button type="button" class="toggle-pw" aria-pressed="false" onclick="togglePassword(this)">表示</button>
        </div>
        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
      </div>

      <div class="form-row">
        <label for="role">ロール</label>
        <select id="role" name="role" th:field="*{role}">
          <option value="USER">USER</option>
          <option value="ADMIN">ADMIN</option>
        </select>
      </div>

      <div class="actions">
        <button type="submit" class="primary">登録</button>
        <button type="reset" class="secondary">リセット</button>
      </div>
    </form>

    <div class="back-link">
      アカウントをお持ちの方はこちらからログインしてください： <a th:href="@{/login}">ログイン</a>
    </div>
  </div>

  <script>
    // パスワード表示切替（アクセシビリティを考慮）
    function togglePassword(btn){
      var pw = document.getElementById('password');
      var pressed = btn.getAttribute('aria-pressed') === 'true';
      if(pressed){
        pw.type = 'password';
        btn.textContent = '表示';
        btn.setAttribute('aria-pressed','false');
      } else {
        pw.type = 'text';
        btn.textContent = '非表示';
        btn.setAttribute('aria-pressed','true');
      }
      btn.focus();
    }

    // 二重送信防止（送信ボタンの無効化）
    function disableOnSubmit(e){
      var form = document.getElementById('registerForm');
      if(!form.checkValidity()){
        form.reportValidity();
        e.preventDefault();
        return;
      }
      var btn = form.querySelector('button[type="submit"]');
      if(btn){
        btn.disabled = true;
        btn.textContent = '送信中...';
      }
      // そのまま送信（サーバ側が処理）
    }
  </script>
</body>
</html>
