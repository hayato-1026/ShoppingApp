<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>注文フォーム</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f9f9f9;
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
            }
            h1 {
                font-size: 2em;
                color: #333;
                margin: 20px 0;
            }
            form {
                width: 80%;
                background-color: #fff;
                padding: 20px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                border-radius: 8px;
                margin: 20px 0;
            }
            table {
                width: 100%;
                border-collapse: collapse;
            }
            th, td {
                padding: 12px 15px;
                text-align: left;
                vertical-align: top;
            }
            th {
                background-color: #f0f0f0;
                color: #333;
                font-weight: bold;
                width: 30%;
            }
            td {
                width: 70%;
            }
            input[type="text"] {
                width: calc(100% - 20px);
                padding: 10px;
                margin: 5px 0;
                font-size: 1em;
                border: 1px solid #ddd;
                border-radius: 4px;
            }
            label {
                font-size: 1em;
                color: #555;
                margin-right: 10px;
            }
            div.th-errors {
                color: #e74c3c;
                font-size: 0.9em;
            }
            input[type="submit"] {
                margin-top: 20px;
                padding: 10px 20px;
                font-size: 1em;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                background-color: #3498db;
                color: #fff;
                font-weight: bold;
            }
            input[type="submit"]:hover {
                background-color: #2980b9;
            }
            /* 支払方法のラジオボタンの配置を調整 */
            .payment-options {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .payment-option {
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
            }
        </style>
    </head>
    <body>
        <h1>注文フォーム</h1>
        <form th:action="@{/order/validate-input}" method="post" th:object="${orderInput}">
            <table>
                <tr>
                    <th>お名前</th>
                    <td>
                        <input type="text" th:field="*{name}" />
                        <div class="th-errors" th:errors="*{name}"></div>
                    </td>
                </tr>
                <tr>
                    <th>住所</th>
                    <td>
                        <input type="text" th:field="*{address}" />
                        <div class="th-errors" th:errors="*{address}"></div>
                    </td>
                </tr>
                <tr>
                    <th>電話番号</th>
                    <td>
                        <input type="text" th:field="*{phone}" />
                        <div class="th-errors" th:errors="*{phone}"></div>
                    </td>
                </tr>
                <tr>
                    <th>メールアドレス</th>
                    <td>
                        <input type="text" th:field="*{emailAddress}" />
                        <div class="th-errors" th:errors="*{emailAddress}"></div>
                    </td>
                </tr>
                <tr>
                    <th>お支払方法</th>
                    <td class="payment-options">
                        <div class="payment-option">
                            <label for="bankRadio">銀行振込</label>
                            <input type="radio" id="bankRadio" value="BANK" th:field="*{paymentMethod}" />
                        </div>
                        <div class="payment-option">
                            <label for="convenienceStoreRadio">コンビニ払い</label>
                            <input type="radio" id="convenienceStoreRadio" value="CONVENIENCE_STORE" th:field="*{paymentMethod}" />
                        </div>
                    </td>
                </tr>
                <tr>
                    <th>利用可能ポイント</th>
                    <td th:text="${availablePoints}">0</td>
                </tr>
                <tr>
                    <th>使用ポイント</th>
                    <td>
                        <input type="number" min="0" th:field="*{usePoints}" />
                        <div class="th-errors" th:errors="*{usePoints}"></div>
                    </td>
                </tr>
            </table>
            <input type="submit" value="注文内容を確認" />
        </form>
    </body>
</html>
