<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>注文確認</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 2em;
      color: #333;
      margin: 20px 0;
    }
    table {
      width: 80%;
      border-collapse: collapse;
      margin: 20px 0;
      background-color: #fff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
    }
    th {
      background-color: #f0f0f0;
      color: #333;
      font-weight: bold;
      border-bottom: 2px solid #ddd;
    }
    tr:nth-child(even) {
      background-color: #f7f7f7;
    }
    tr:hover {
      background-color: #f0f8ff;
    }
    div {
      width: 80%;
      margin: 20px 0;
      font-size: 1.2em;
      color: #555;
    }
    input[type="submit"] {
      margin: 10px 5px;
      padding: 10px;
      font-size: 1em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background-color: #3498db;
      color: #fff;
    }
    input[type="submit"]:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <h1>注文確認</h1>
  <form th:action="@{/order/place-order}" method="post" th:object="${orderInput}">
    <table>
      <tr>
        <th>お名前</th>
        <td><span th:text="*{name}"></span></td>
      </tr>
      <tr>
        <th>住所</th>
        <td><span th:text="*{address}"></span></td>
      </tr>
      <tr>
        <th>電話番号</th>
        <td><span th:text="*{phone}"></span></td>
      </tr>
      <tr>
        <th>メールアドレス</th>
        <td><span th:text="*{emailAddress}"></span></td>
      </tr>
      <tr>
        <th>お支払方法</th>
        <td>
          <span th:if="*{paymentMethod != null && paymentMethod.toString() == 'BANK'}">銀行振込</span>
          <span th:if="*{paymentMethod != null && paymentMethod.toString() == 'CONVENIENCE_STORE'}">コンビニ払い</span>
        </td>
      </tr>
    </table>
    <div>以下を注文します。</div>
    <table>
      <tr>
        <th>商品名</th>
        <th>価格</th>
        <th>数量</th>
      </tr>
      <tr th:each="item:${cartInput.cartItemInputs}">
        <td th:text="${item.productName}"></td>
        <td><span th:text="${item.productPrice}"></span>円</td>
        <td th:text="${item.quantity}"></td>
      </tr>
    </table>
    <div>合計金額: <span th:text="${cartInput.totalAmount}"></span>円</div>
    <div>請求金額: <span th:text="${cartInput.billingAmount}"></span>円(税込)</div>
    <div>使用ポイント: <span th:text="${usedPoints}"></span>pt</div>
    <div>支払金額(ポイント適用後): <span th:text="${payableAmount}"></span>円</div>
    <input name="order" type="submit" value="注文を確定"/>
    <input name="correct" type="submit" value="注文内容を変更"/>
  </form>
</body>
</html>
